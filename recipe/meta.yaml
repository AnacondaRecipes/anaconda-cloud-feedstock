{% set name = "anaconda-cloud" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/anaconda_cloud-{{ version }}.tar.gz
  sha256: f32735de262aa3d10899b3e945b6f76a12f9f73f02e72d7694416680bee319dd

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - hatchling
    - hatch-vcs >=0.3
    - setuptools-scm >=7.1
    - pip
  run:
    - python
    - anaconda-cloud-auth 0.7.2
    - anaconda-cli-base
    - anaconda-client >=1.12.2
    - conda
    - backports

test:
  imports:
    - anaconda_cloud
    - anaconda_cli_base
    - anaconda_cloud_auth
  commands:
    - anaconda --version
    - python -c "from anaconda_cloud import __version__; assert __version__ == \"{{ version }}\""
    - pip check
  requires:
    - pip
    # Cannot run pytest since PyPI lacks tests

about:
  summary: Anaconda Cloud client tools
  description: Anaconda Cloud client tools
  home: https://anaconda.cloud
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  doc_url: https://anaconda.cloud/
  dev_url: https://inspector.pypi.io/project/anaconda-cloud

extra:
  recipe-maintainers:
    - albertdefusco
    - mattkram